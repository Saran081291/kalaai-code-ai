# Kalaai Code SPA - served by nginxinc/nginx-unprivileged on port 8080.
# __API_ORIGIN__ is replaced at image build time with VITE_API_URL (see Dockerfile).
# Security headers are set at server level; locations below only use `expires`
# (not add_header) so the server-level headers are inherited everywhere.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # --- Security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # --- Liveness probe for the container HEALTHCHECK ----------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Hashed build assets: cache for a year -----------------------------
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # --- index.html must never be cached (it references hashed assets) -----
    location = /index.html {
        expires -1;
    }

    # --- SPA fallback (client-side routes such as /r/:slug) ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
